<title>Lysandre &amp; Louisa</title>
<meta name="description" content="Save the date : Louisa &amp; Lysandre se marient le samedi 4 septembre 2027 au château de Chambord.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cormorant+Garamond:wght@500;600&family=Gloock&display=swap">
<style>
  /* Layout: one printed card on a sage table. Front = vertical title + three proposal photos; tap to turn it over. */
  :root {
    --table: #b4c0a6;          /* sage ground */
    --table-ink: #3f4c38;
    --paper: #f8f8f3;          /* card stock, white */
    --sage: #8a9a7e;
    --sage-dark: #4f5e47;
    --photo-ink: #ffffff;

    --font-title: 'Gloock', 'Didot', Georgia, serif;
    --font-text: 'Cormorant Garamond', Garamond, 'Times New Roman', serif;
    --font-script: 'Alex Brush', 'Snell Roundhand', 'Apple Chancery', cursive;

    color-scheme: light;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--table);
    color: var(--table-ink);
    font-family: var(--font-text);
    padding-inline: 16px;
    padding-block: clamp(16px, 4vh, 40px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
    overflow-x: hidden;
  }

  /* ---------- the card ---------- */

  .scene {
    width: min(500px, 100%, calc((100svh - 150px) / 1.4));
    min-width: 270px;
    perspective: 1800px;
  }

  .card {
    container-type: inline-size;
    position: relative;
    width: 100%;
    aspect-ratio: 5 / 7;
    cursor: pointer;
    transform-style: preserve-3d;
    transition: transform 1.1s cubic-bezier(0.45, 0.05, 0.2, 1);
    -webkit-tap-highlight-color: transparent;
  }

  .card.is-flipped { transform: rotateY(180deg); }

  .card:focus-visible { outline: none; }
  .card:focus-visible .face { box-shadow: 0 0 0 3px var(--sage-dark), 0 22px 44px -18px rgba(50, 64, 44, 0.45); }

  .face {
    position: absolute;
    inset: 0;
    overflow: hidden;
    background: var(--paper);
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    box-shadow:
      0 1px 2px rgba(50, 64, 44, 0.12),
      0 22px 44px -18px rgba(50, 64, 44, 0.45);
  }

  /* ---------- front ---------- */

  .front {
    display: grid;
    grid-template-columns: 1fr 62cqw;
    padding: 3.2cqw 3.2cqw 3.2cqw 0;
  }

  .spine {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 3.4cqw;
    color: var(--sage-dark);
  }

  .spine > * {
    margin: 0;
    writing-mode: vertical-rl;
    transform: rotate(180deg);
    white-space: nowrap;
  }

  .title {
    font-family: var(--font-title);
    font-weight: 400;
    font-size: 13.6cqw;
    line-height: 1;
    letter-spacing: 0.01em;
  }

  .details {
    font-size: 3cqw;
    font-weight: 600;
    letter-spacing: 0.14em;
    line-height: 1;
  }

  .details .bar {
    display: inline-block;
    /* the text runs vertically, so the space before/after a bar is margin-inline (top/bottom on screen) */
    margin-inline: 0.9em;
    color: var(--sage);
    font-weight: 500;
  }

  .details .caps { text-transform: uppercase; letter-spacing: 0.2em; }

  .photos {
    display: grid;
    grid-template-rows: repeat(3, 1fr);
    gap: 2.4cqw;
    min-height: 0;
  }

  .photos figure {
    margin: 0;
    overflow: hidden;
    min-height: 0;
  }

  .photos img {
    display: block;
    width: 100%;
    max-width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 46% 50%;
  }

  /* ---------- back ---------- */

  .back {
    transform: rotateY(180deg);
    background: var(--sage-dark);
  }

  .back img {
    position: absolute;
    inset: 0;
    width: 100%;
    max-width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 50% 64%;
  }

  .back::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(34, 42, 30, 0.62) 0%, rgba(34, 42, 30, 0.25) 26%, rgba(34, 42, 30, 0) 42%);
    pointer-events: none;
  }

  .back-text {
    position: absolute;
    left: 6cqw;
    right: 6cqw;
    bottom: 7cqw;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2.2cqw;
    color: var(--photo-ink);
    text-align: center;
    text-shadow: 0 1px 10px rgba(20, 26, 18, 0.35);
  }

  .back-text p { margin: 0; }

  .back-text .script {
    font-family: var(--font-script);
    font-size: 11cqw;
    line-height: 1.05;
  }

  .back-text .line {
    font-size: 4cqw;
    font-weight: 600;
    letter-spacing: 0.06em;
  }

  .back-text .small {
    font-size: 3.1cqw;
    font-weight: 600;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    padding-left: 0.24em;
  }

  /* ---------- control under the card ---------- */

  .turn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 9px 20px;
    border: 1px solid var(--sage);
    border-radius: 999px;
    background: var(--paper);
    color: var(--sage-dark);
    font-family: var(--font-text);
    font-size: 17px;
    font-weight: 600;
    letter-spacing: 0.04em;
    cursor: pointer;
    transition: background-color 0.2s, color 0.2s;
  }

  .turn:hover { background: var(--sage-dark); color: var(--paper); }
  .turn:focus-visible { outline: 2px solid var(--sage-dark); outline-offset: 3px; }

  .lang {
    position: fixed;
    top: calc(14px + env(safe-area-inset-top, 0px));
    right: 16px;
    z-index: 2;
    display: flex;
    padding: 3px;
    border: 1px solid var(--sage);
    border-radius: 999px;
    background: var(--paper);
  }

  .lang button {
    padding: 5px 12px;
    border: 0;
    border-radius: 999px;
    background: transparent;
    color: var(--sage-dark);
    font-family: var(--font-text);
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.12em;
    cursor: pointer;
  }

  .lang button[aria-pressed="true"] { background: var(--sage-dark); color: var(--paper); }
  .lang button:focus-visible { outline: 2px solid var(--sage-dark); outline-offset: 2px; }

  .turn svg {
    width: 18px;
    height: 18px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.6;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* ---------- arrival sequence ---------- */

  @media (prefers-reduced-motion: no-preference) {
    .scene { animation: arrive 1s cubic-bezier(0.2, 0.7, 0.2, 1) both; }

    .spine { animation: rise 1.2s cubic-bezier(0.6, 0, 0.2, 1) 0.6s both; }
    /* opacity only: a transform here would undo the 180° rotation of the vertical text */
    .details { animation: appear 0.9s ease-out 2.3s both; }

    .photos figure { animation: unveil 0.9s cubic-bezier(0.6, 0, 0.2, 1) both; }
    .photos figure:nth-child(1) { animation-delay: 1.0s; }
    .photos figure:nth-child(2) { animation-delay: 1.35s; }
    .photos figure:nth-child(3) { animation-delay: 1.7s; }

    .photos img { animation: settle 1.4s ease-out both; }
    .photos figure:nth-child(1) img { animation-delay: 1.0s; }
    .photos figure:nth-child(2) img { animation-delay: 1.35s; }
    .photos figure:nth-child(3) img { animation-delay: 1.7s; }

    /* no fill-mode: the nudge must not hold a transform once the card is turned */
    .card:not(.was-flipped) { animation: nudge 1.4s ease-in-out 3.4s; }
    .turn { animation: fade 0.8s ease-out 3s both; }
  }

  @keyframes arrive {
    from { opacity: 0; transform: translateY(40px) rotate(-3deg) scale(0.96); }
    to   { opacity: 1; transform: none; }
  }

  /* the title is written bottom-to-top, so it is revealed from the bottom */
  @keyframes rise {
    from { clip-path: inset(100% 0 0 0); }
    to   { clip-path: inset(0 0 0 0); }
  }

  @keyframes unveil {
    from { clip-path: inset(0 100% 0 0); }
    to   { clip-path: inset(0 0 0 0); }
  }

  @keyframes settle {
    from { transform: scale(1.12); }
    to   { transform: scale(1); }
  }

  @keyframes appear {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  @keyframes fade {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: none; }
  }

  /* a small lift of the corner, to show the card can be turned */
  @keyframes nudge {
    0%, 100% { transform: rotateY(0); }
    35%      { transform: rotateY(-16deg); }
    60%      { transform: rotateY(4deg); }
  }
</style>

<main class="scene">
  <div class="card" id="card" role="button" tabindex="0" aria-pressed="false"
       aria-label="Carte save the date, appuyer pour la retourner">

    <section class="face front">
      <div class="spine">
        <h1 class="title">SAVE THE DATE</h1>
        <p class="details">
          <span class="caps">Louisa &amp; Lysandre</span><span class="bar">|</span><time datetime="2027-09-04" data-i18n="date">04 Septembre 2027</time><span class="bar">|</span>Chambord, Centre-Val de Loire
        </p>
      </div>

      <div class="photos">
        <figure><img src="img/genou.jpg" width="1100" height="760" data-i18n-alt="alt1" alt="Lysandre fait sa demande à genou sur un toit de Paris"></figure>
        <figure><img src="img/genou-calin.jpg" width="1100" height="760" data-i18n-alt="alt2" alt="Louisa se penche pour l'embrasser"></figure>
        <figure><img src="img/debout.jpg" width="1100" height="760" data-i18n-alt="alt3" alt="Louisa et Lysandre enlacés sur le toit"></figure>
      </div>
    </section>

    <section class="face back" aria-hidden="true">
      <img src="img/bague.jpg" width="831" height="1800" data-i18n-alt="alt4" alt="Louisa montre sa bague de fiançailles, la tour Eiffel au loin">
      <div class="back-text">
        <p class="script" data-i18n="script">Soyez des nôtres !</p>
        <p class="line"><span data-i18n="day">Samedi 4 Septembre 2027</span><br>Château de Chambord</p>
        <p class="small" data-i18n="follow">Faire-part à suivre</p>
      </div>
    </section>
  </div>
</main>

<button class="turn" id="turn" type="button">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 0 1 14-5.3M20 4v4h-4M20 12a8 8 0 0 1-14 5.3M4 20v-4h4"/></svg>
  <span id="turn-label">Retourner la carte</span>
</button>

<div class="lang" role="group" aria-label="Langue / Language">
  <button type="button" data-lang="fr" aria-pressed="true">FR</button>
  <button type="button" data-lang="en" aria-pressed="false">EN</button>
</div>

<script>
  (function () {
    // « Save the date » reste tel quel dans les deux langues.
    var text = {
      fr: {
        date: '04 Septembre 2027',
        script: 'Soyez des nôtres !',
        day: 'Samedi 4 Septembre 2027',
        follow: 'Faire-part à suivre',
        turn: 'Retourner la carte',
        turnBack: 'Revoir le recto',
        card: 'Carte save the date, appuyer pour la retourner',
        alt1: 'Lysandre fait sa demande à genou sur un toit de Paris',
        alt2: "Louisa se penche pour l'embrasser",
        alt3: 'Louisa et Lysandre enlacés sur le toit',
        alt4: 'Louisa montre sa bague de fiançailles, la tour Eiffel au loin'
      },
      en: {
        date: 'September 4, 2027',
        script: 'Join us!',
        day: 'Saturday, September 4, 2027',
        follow: 'Formal invitation to follow',
        turn: 'Turn the card over',
        turnBack: 'See the front',
        card: 'Save the date card, tap to turn it over',
        alt1: 'Lysandre proposing on one knee on a Paris rooftop',
        alt2: 'Louisa leaning down to kiss him',
        alt3: 'Louisa and Lysandre embracing on the rooftop',
        alt4: 'Louisa showing her engagement ring, the Eiffel Tower in the distance'
      }
    };

    var card = document.getElementById('card');
    var button = document.getElementById('turn');
    var label = document.getElementById('turn-label');
    var front = card.querySelector('.front');
    var back = card.querySelector('.back');
    var lang = 'fr';

    function setLang(next) {
      lang = text[next] ? next : 'fr';
      var t = text[lang];
      document.documentElement.lang = lang;
      document.querySelectorAll('[data-i18n]').forEach(function (el) {
        el.textContent = t[el.dataset.i18n];
      });
      document.querySelectorAll('[data-i18n-alt]').forEach(function (el) {
        el.alt = t[el.dataset.i18nAlt];
      });
      card.setAttribute('aria-label', t.card);
      if (typeof fitDetails === 'function') fitDetails();
      label.textContent = card.classList.contains('is-flipped') ? t.turnBack : t.turn;
      document.querySelectorAll('.lang button').forEach(function (b) {
        b.setAttribute('aria-pressed', String(b.dataset.lang === lang));
      });
      try { localStorage.setItem('std-lang', lang); } catch (e) {}
    }

    function flip() {
      var flipped = card.classList.toggle('is-flipped');
      card.classList.add('was-flipped');
      card.setAttribute('aria-pressed', String(flipped));
      front.setAttribute('aria-hidden', String(flipped));
      back.setAttribute('aria-hidden', String(!flipped));
      label.textContent = flipped ? text[lang].turnBack : text[lang].turn;
    }

    document.querySelectorAll('.lang button').forEach(function (b) {
      b.addEventListener('click', function () { setLang(b.dataset.lang); });
    });

    // La ligne verticale (noms | date | lieu) doit tenir dans la hauteur de la carte.
    var spine = card.querySelector('.spine');
    var details = card.querySelector('.details');
    function fitDetails() {
      details.style.fontSize = '';
      var room = spine.clientHeight * 0.96;
      var length = details.scrollHeight;
      if (length > room) {
        var size = parseFloat(getComputedStyle(details).fontSize);
        details.style.fontSize = (size * room / length) + 'px';
      }
    }
    window.addEventListener('resize', fitDetails);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitDetails);
    fitDetails();

    var saved = null;
    try { saved = localStorage.getItem('std-lang'); } catch (e) {}
    if (location.hash === '#en' || location.hash === '#fr') saved = location.hash.slice(1);
    if (saved) setLang(saved);

    // a mouse or finger tap should not leave a focus ring around the card
    card.addEventListener('pointerdown', function (e) { e.preventDefault(); });
    card.addEventListener('click', flip);
    card.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flip(); }
    });
    button.addEventListener('click', flip);
  })();
</script>
